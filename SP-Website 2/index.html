<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structural and Process Services</title>
<meta name="description" content="Structural and Process Services. Design, build, fabricate. Ryland Heights, Kentucky.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
/* layout: one quiet centered column; drawings on a ground line stand in for the work; photos open one project at a time */
:root{
  --bg:#ffffff;
  --ink:#111213;
  --soft:#6b6e72;
  --rule:#d9dadc;
  --hover:#f4f4f5;
  --logo-filter:none;
  --body:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121314;--ink:#ececea;--soft:#9a9ca0;--rule:#34363a;--hover:#1c1d1f;--logo-filter:invert(1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121314;--ink:#ececea;--soft:#9a9ca0;--rule:#34363a;--hover:#1c1d1f;--logo-filter:invert(1);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.wrap{max-width:900px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;padding-block:28px 8px}
.logo{display:block;width:92px}
.logo img{display:block;width:100%;filter:var(--logo-filter)}
.burger{background:none;border:0;padding:10px 0 10px 10px;cursor:pointer;color:var(--ink);display:grid;gap:9px}
.burger span{display:block;width:44px;height:2px;background:currentColor;transition:transform .2s}
.burger[aria-expanded="true"] span:first-child{transform:translateY(5.5px) rotate(45deg)}
.burger[aria-expanded="true"] span:last-child{transform:translateY(-5.5px) rotate(-45deg)}

nav.menu{display:flex;justify-content:flex-end;gap:28px;font-size:19px;padding-block:4px 8px}
nav.menu a{text-decoration:none}
nav.menu a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

main{padding-block:24px 40px;min-height:50vh}
.lede{text-align:center;font-size:clamp(19px,2.6vw,24px);letter-spacing:.02em;margin:24px 0 8px;text-wrap:balance}
.sub{text-align:center;color:var(--soft);font-size:15px;margin:0 0 40px}

/* the work list */
.work{list-style:none;margin:0;padding:0}
.work li a{display:block;text-decoration:none;padding-block:14px 10px;border-radius:2px}
.work li a:hover{background:var(--hover)}
.work svg{display:block;width:100%;max-width:560px;margin:0 auto;height:auto;overflow:visible}
.work svg *{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.work .cap{display:flex;justify-content:space-between;gap:16px;font-size:14px;color:var(--soft);padding-top:6px}
.work .cap b{font-weight:400;color:var(--ink)}
.work li a:hover .cap b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* project page */
.proj h1{font-weight:300;font-size:clamp(22px,3vw,28px);text-align:center;margin:20px 0 6px;text-wrap:balance}
.proj .meta{text-align:center;color:var(--soft);font-size:15px;margin:0 0 36px}
.car{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.car figure{margin:0;display:flex;justify-content:center;align-items:center;min-height:min(62vh,560px)}
.car img{max-height:min(62vh,560px);max-width:100%;width:auto;height:auto;display:block}
.arrow{background:none;border:0;color:var(--ink);cursor:pointer;height:64px;display:grid;place-items:center}
.arrow svg{width:16px;height:40px}
.arrow svg path{fill:none;stroke:currentColor;stroke-width:1.3}
.arrow:disabled{visibility:hidden}
.count{text-align:center;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums;margin-top:14px}
.thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.thumbs button{border:0;padding:0;background:none;cursor:pointer;opacity:.45;transition:opacity .15s}
.thumbs button[aria-current="true"],.thumbs button:hover{opacity:1}
.thumbs img{width:64px;height:48px;object-fit:cover;display:block}
.desc{max-width:62ch;margin:36px auto 0;text-align:center;text-wrap:pretty}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:48px;padding-top:18px;border-top:1px solid var(--rule);font-size:15px}
.pager a{text-decoration:none;color:var(--soft)}
.pager a:hover{color:var(--ink)}

/* text pages */
.text{max-width:62ch;margin:0 auto}
.text h1{font-weight:300;font-size:clamp(22px,3vw,28px);margin:20px 0 24px;text-align:center}
.text h2{font-weight:400;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:44px 0 12px}
.text p{margin:0 0 16px}
.text ul{margin:0;padding:0;list-style:none;columns:2 18rem;column-gap:32px}
.text ul li{padding:5px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.person{margin:0 0 22px}
.person b{font-weight:500;display:block}
.contact{text-align:center;font-size:clamp(18px,2.4vw,21px);line-height:1.9}
.contact .soft{color:var(--soft);font-size:15px;line-height:1.6;margin-top:28px}

footer{text-align:center;padding-block:56px 64px;font-size:clamp(16px,2.2vw,19px);line-height:2.2}
footer .soft{color:var(--soft);font-size:14px;line-height:1.6}

@media (max-width:520px){
  .car{grid-template-columns:28px minmax(0,1fr) 28px;gap:4px}
  .work .cap{flex-direction:column;gap:0}
  nav.menu{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const svg = p => `<svg viewBox="0 -24 400 124" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${D[p.s]}</svg>`;

function home(){
  document.title = "Structural and Process Services";
  main.innerHTML = `
    <p class="lede">design · build · fabricate</p>
    <p class="sub">structural repair and process infrastructure, Northern Kentucky and Greater Cincinnati</p>
    <ul class="work">${P.map(p=>`
      <li><a href="#${p.s}">${svg(p)}
        <span class="cap"><b>${esc(p.t)}</b><span>${p.c} · ${p.y}</span></span></a></li>`).join("")}
    </ul>`;
}

function project(i){
  const p = P[i];
  let k = 0;
  document.title = p.t + " · S&P";
  const src = n => `img/${p.s}-${n+1}.jpg`;
  const prev = P[(i-1+P.length)%P.length], next = P[(i+1)%P.length];
  main.innerHTML = `
    <article class="proj">
      <h1>${esc(p.t)}</h1>
      <p class="meta">${p.c} · ${p.y}</p>
      <div class="car">
        <button class="arrow" id="prev" aria-label="Previous photo"><svg viewBox="0 0 16 40"><path d="M14 2L2 20L14 38"/></svg></button>
        <figure><img id="shot" src="${src(0)}" alt="${esc(p.t)}, photo 1"></figure>
        <button class="arrow" id="next" aria-label="Next photo"><svg viewBox="0 0 16 40"><path d="M2 2L14 20L2 38"/></svg></button>
      </div>
      ${p.n>1?`<div class="count" id="count"></div>
      <div class="thumbs">${Array.from({length:p.n},(_,n)=>`<button data-n="${n}" aria-label="Photo ${n+1}"><img src="${src(n)}" alt="" loading="lazy"></button>`).join("")}</div>`:""}
      <p class="desc">${esc(p.desc)}</p>
      <div class="pager"><a href="#${prev.s}">← ${esc(prev.t)}</a><a href="#${next.s}">${esc(next.t)} →</a></div>
    </article>`;
  const shot = document.getElementById("shot"), bp = document.getElementById("prev"), bn = document.getElementById("next");
  const count = document.getElementById("count"), tb = [...main.querySelectorAll(".thumbs button")];
  function show(n){
    k = (n + p.n) % p.n;
    shot.src = src(k); shot.alt = `${p.t}, photo ${k+1}`;
    if(count) count.textContent = `${k+1} / ${p.n}`;
    tb.forEach((b,j)=>b.setAttribute("aria-current", j===k));
  }
  bp.disabled = bn.disabled = p.n < 2;
  bp.onclick = () => show(k-1); bn.onclick = () => show(k+1);
  tb.forEach(b => b.onclick = () => show(+b.dataset.n));
  let x0 = null;
  shot.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  shot.addEventListener("touchend", e => { if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 40) show(k + (dx < 0 ? 1 : -1)); x0 = null; });
  window.onkeydown = e => { if(e.key==="ArrowLeft") show(k-1); if(e.key==="ArrowRight") show(k+1); };
  show(0);
}

function about(){
  document.title = "About · S&P";
  main.innerHTML = `
    <article class="text">
      <h1>about</h1>
      <p>Structural and Process Services is a self-perform contractor in Ryland Heights, Kentucky. We repair and build structures for water and wastewater utilities, public owners, parks, universities and industry across Northern Kentucky and Greater Cincinnati.</p>
      <p>Design, fabrication and field installation stay under one roof. A licensed professional engineer leads the work from the first condition assessment through the last weld. We perform bonded public work and run on-call structural renewal and emergency response for utility assets.</p>
      <h2>what we self-perform</h2>
      <ul>
        <li>Structural steel and concrete repair</li>
        <li>Certified welding and metal fabrication</li>
        <li>Engineer-led condition assessment and repair design</li>
        <li>Confined-space entry</li>
        <li>Protective coatings and linings</li>
        <li>Pumping, dewatering, bypass and leak testing</li>
        <li>Excavation and trench work</li>
        <li>Tank removal, piping and process mechanical</li>
        <li>Crane, rigging and heavy lifts</li>
        <li>On-call and emergency response</li>
      </ul>
      <h2>safety</h2>
      <p>A perfect safety record since our founding. Our crews include OSHA 30, confined-space, trench safety and certified rigging credentials. Bonded and insured for public work.</p>
      <h2>people</h2>
      <div class="person"><b>Dan Breetz, P.E.</b>Licensed professional engineer with more than 20 years in construction. Before S&amp;P, senior project manager on water and wastewater treatment, pump station, rail, mining and food-processing construction.</div>
      <div class="person"><b>Charlie Breetz</b>B.S. Construction Management, Northern Kentucky University. More than 20 years in structural and concrete repair, carpenter to superintendent, before founding S&amp;P in 2020.</div>
    </article>`;
}

function contact(){
  document.title = "Contact · S&P";
  main.innerHTML = `
    <article class="contact">
      <div>Dan Breetz P.E. + Charlie Breetz</div>
      <div>859-982-9326</div>
      <div>dan.breetz@spserviceskentucky.com</div>
      <div class="soft">8867 Decoursey Pike<br>Ryland Heights, Kentucky 41015</div>
    </article>`;
}

function route(){
  const h = location.hash.slice(1);
  window.onkeydown = null;
  const i = P.findIndex(p => p.s === h);
  if(i >= 0) project(i); else if(h === "about") about(); else if(h === "contact") contact(); else home();
  menu.hidden = true; burger.setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}

const burger = document.getElementById("burger"), menu = document.getElementById("menu");
burger.onclick = () => { const open = menu.hidden; menu.hidden = !open; burger.setAttribute("aria-expanded", open); };
window.addEventListener("hashchange", route);
route();
</script>
